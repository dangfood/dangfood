<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre}">Nouveau menu • Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0fdf4; }
        .header { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; }
        .header a { color: #d4af37; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #1a1a1a; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-gold { background: #d4af37; color: white; width: 100%; }
        .btn-gold:hover { background: #b8962c; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${titre}">Nouveau menu</h1>
        <a th:href="@{/admin/menus/{id}(id=${restaurant.id})}">← Retour</a>
    </div>
    
    <div class="container">
        <div class="form-card">
            <form th:action="@{/admin/menus/sauvegarder}" method="post">
                <input type="hidden" name="restaurantId" th:value="${restaurant.id}">
                
                <div class="form-group">
                    <label for="type">Type de menu</label>
                    <select id="type" name="type" required>
                        <option value="">Sélectionner</option>
                        <option th:each="type : ${typesMenu}" th:value="${type.name()}" th:text="${type.libelle}">Type</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                
                <button type="submit" class="btn btn-gold">Créer le menu</button>
            </form>
        </div>
    </div>
</body>
</html>
