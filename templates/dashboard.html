<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre}">Administration • Campus Dang Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-card: #141414;
            --bg-elevated: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --gold-primary: #d4af37;
            --gold-light: #e8c547;
            --gold-dark: #b8962c;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.3);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-gold); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold-primary); }
        .header a { color: var(--text-secondary); text-decoration: none; transition: 0.3s; }
        .header a:hover { color: var(--gold-primary); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 16px; padding: 30px; text-align: center; }
        .stat-card h2 { font-size: 2.5rem; color: var(--gold-primary); }
        .stat-card p { color: var(--text-muted); }
        .resto-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .resto-card h3 { color: var(--text-primary); font-size: 1.2rem; }
        .resto-card p { color: var(--text-muted); }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-gold { background: var(--gold-primary); color: var(--bg-primary); }
        .btn-gold:hover { background: var(--gold-dark); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); }
        .btn-secondary:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍🍳 Administration - Campus Dang Food</h1>
        <div>
            <a href="/logout" style="color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
        </div>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h2 th:text="${totalRestaurants}">3</h2>
                <p>Restaurants</p>
            </div>
            <div class="stat-card">
                <h2>9</h2>
                <p>Menus aujourd'hui</p>
            </div>
            <div class="stat-card">
                <h2>33</h2>
                <p>Plats disponibles</p>
            </div>
        </div>
        
        <h2 style="color: var(--text-primary); margin-bottom: 20px;">Gérer les restaurants</h2>
        <div th:each="restaurant : ${restaurants}" class="resto-card">
            <div>
                <h3 th:text="${restaurant.nom}">Nom</h3>
                <p th:text="${restaurant.adresse}">Adresse</p>
            </div>
            <div>
                <a th:href="@{/admin/menus/{id}(id=${restaurant.id})}" class="btn btn-gold">
                    <i class="fas fa-utensils"></i> Gérer les menus
                </a>
            </div>
        </div>
    </div>
</body>
</html>
