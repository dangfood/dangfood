<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre}">Ajouter un plat • Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0fdf4; }
        .header { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; }
        .header a { color: #d4af37; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #1a1a1a; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-gold { background: #d4af37; color: white; width: 100%; }
        .btn-gold:hover { background: #b8962c; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${titre}">Ajouter un plat</h1>
        <a th:href="@{/admin/menus/{id}(id=${menu.id})}">← Retour</a>
    </div>
    
    <div class="container">
        <div class="form-card">
            <p><strong>Menu :</strong> <span th:text="${menu.type.libelle}">Type</span></p>
            <p><strong>Restaurant :</strong> <span th:text="${menu.restaurant.nom}">Nom</span></p>
            
            <form th:action="@{/admin/plats/sauvegarder}" method="post">
                <input type="hidden" name="menuId" th:value="${menu.id}">
                
                <div class="form-group">
                    <label for="nom">Nom du plat</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex: Poulet DG" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" placeholder="Décrivez le plat"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="prix">Prix (FCFA)</label>
                    <input type="number" id="prix" name="prix" step="0.01" placeholder="Ex: 3500" required>
                </div>
                
                <div class="form-group">
                    <label for="categorie">Catégorie</label>
                    <select id="categorie" name="categorie">
                        <option value="plat_principal">Plat principal</option>
                        <option value="entree">Entrée</option>
                        <option value="dessert">Dessert</option>
                        <option value="boisson">Boisson</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-gold">Ajouter le plat</button>
            </form>
        </div>
    </div>
</body>
</html>
