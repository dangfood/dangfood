<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion • Campus Dang Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-card: #141414;
            --bg-elevated: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --gold-primary: #d4af37;
            --gold-light: #e8c547;
            --gold-dark: #b8962c;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(184, 115, 51, 0.05) 0%, transparent 50%);
        }

        .login-box {
            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid var(--border-gold);
            width: 420px;
            max-width: 90%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-light), var(--gold-dark));
        }

        .logo {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .login-box h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .login-box h1 span {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--gold-primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .error i {
            margin-right: 8px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold);
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .forgot-password:hover {
            color: var(--gold-primary);
        }

        .logout-message {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            .login-box h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🍽️</div>
        <h1>Campus Dang <span>Food</span></h1>
        
        <div th:if="${param.error}" class="error">
            <i class="fas fa-exclamation-circle"></i> Email ou mot de passe incorrect
        </div>
        
        <div th:if="${param.logout}" class="logout-message">
            <i class="fas fa-check-circle"></i> Vous avez été déconnecté
        </div>
        
        <form th:action="@{/login}" method="post">
           <div class="form-group">
    <label for="username">Email</label>
    <input type="email"
           id="username"
           name="username"
           placeholder="Email"
           autocomplete="new-password"
           required>
</div>

<div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Mot de passe"
           autocomplete="new-password"
           required>
</div>
            <button type="submit" class="btn">Se connecter</button>
            <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        </form>
          <a href="/" class="back-btn">
        <i class="fas fa-arrow-left"></i> Retour au site
    </a>
    </div>
</body>
</html>
