# ============================================
# 🌍 Configuration de l'application
# ============================================
spring.application.name=Campus Dang Restauration
server.port=8080

# ============================================
# 💾 Base de données MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/campusdangdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# 🔧 Configuration JPA/Hibernate
# ============================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 🎨 Configuration Thymeleaf
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# 📁 Upload de fichiers
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# 📅 Format de date
# ============================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Africa/Douala

# ============================================
# 🔄 DevTools
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true